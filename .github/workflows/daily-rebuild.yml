# Rebuilds the site every morning so new Substack posts, YouTube videos,
# ORCID publications and GitHub repos appear without you doing anything.
name: Daily rebuild
on:
  schedule:
    - cron: '0 1 * * *' # 06:00 Pakistan time
  workflow_dispatch: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "Add the VERCEL_DEPLOY_HOOK secret (see SETUP.md, step 6)."; exit 1
          fi
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
